# Configuration for the AirTouch climate control service (climate_service.py).
#
# All temperatures are in degrees Celsius. Unit names must match the names
# configured in the AirTouch console exactly.

[service]
host = "192.168.5.221"        # AirTouch console (IoT VLAN — directed discovery)
poll_interval_seconds = 30    # how often the control loop evaluates temperatures
dry_run = false               # true = log intended commands without sending them
log_file = "climate.log"      # service log file (relative to this config file),
                              # rotated at ~1 MB and tailed by the web dashboard.
                              # Set to "" to log to stdout only.

[defaults]
target_low = 23               # heat when a room drops below this
target_high = 24.8            # cool when a room rises above this
heating = false               # false = never heat (summer). Rooms never demand
                              # heat however cold they get, and a group with no
                              # heating rooms stays in COOL all day — no more
                              # 08:00 warm-up that the sun undoes by 11:00.
                              # Override per room with [rooms."X"] heating = true.
heat_hysteresis = 0.4         # keep heating this far above target_low before
                              # switching a unit off
cool_hysteresis = 1.2         # keep cooling this far below target_high before
                              # switching off. Wider than heating on purpose:
                              # cooling pulls the room sensor down within minutes
                              # and the sun pushes it straight back, so a 0.4 band
                              # gave 8-minute runs every 25 minutes in late winter
                              # (see EFFICIENCY_PLAN.md). Rooms swing 23.6–24.9.
                              # (`hysteresis` still works and sets both.)
demand_persist_polls = 2      # a change in a room's demand must hold for this many
                              # consecutive polls before it's acted on — the console
                              # occasionally emits one glitched sample (e.g. several
                              # rooms reading exactly 25.0°C for a single poll) which
                              # must not flip a group's mode or toggle power
min_mode_dwell_minutes = 60   # minimum time between heat<->cool switches per group
min_power_toggle_minutes = 10 # minimum time between starts/stops of a group's
                              # shared outdoor unit (compressor). Turning a unit
                              # on/off while other units in its group keep the
                              # compressor running is not held back.
manage_setpoints = true       # also push each unit's setpoint to match the range
heat_setpoint_boost = 1       # °C to overshoot heating setpoints past the off
                              # threshold. Units modulate on their own return-air
                              # sensor, which reads warm (stratification) before
                              # the room does, so without the boost they taper
                              # off early; the room sensor still decides power-off.
cool_setpoint_boost = 0       # Cooling is the mirror image: the return-air
                              # sensor reads *warmer* than the room, so the unit
                              # never tapers early and a boost buys nothing —
                              # it only widens the gap the unit sees, which in
                              # AUTO fan means full blast, draft and undershoot.
                              # (`setpoint_boost` still works and sets both.)
cool_fan_speed = "medium"     # fan speed pushed when a unit starts cooling
                              # (auto / quiet / low / medium / high / powerful,
                              # or "keep" to never touch it). Default medium.
heat_fan_speed = "auto"       # same for heating. Default auto.
pending_off_fan_speed = "quiet"  # fan while the compressor hold below keeps a
                              # satisfied unit on: as quiet as possible. "off"
                              # disables the drop. The mode's fan speed is
                              # re-asserted when the unit next switches on.

[shutdown]
enabled = true                # master switch for the windows below
windows = ["20:00-08:00"]     # local time, "HH:MM-HH:MM"; may cross midnight.
                              # When a window starts every unit is switched
                              # off once; a unit switched on manually during
                              # the window stays on. Add more windows as extra
                              # list entries; for an "away" mode use
                              # ["00:00-24:00"] (all day, every day).
                              # The service reads this file only at startup —
                              # restart it after changes.

[history]
enabled = true                # record per-unit temperature samples over time
path = "history.db"           # SQLite file (relative to this config file)
interval_seconds = 60         # sample rate

[weather]
enabled = true                # receive Ecowitt customized-upload reports and
                              # record outdoor temperature + solar W/m² to the
                              # history DB (shown on the dashboard's combined
                              # chart). The console must be pointed at this
                              # host — see ECOWITT.md. Only one process can
                              # own the port: stop ecowitt_listener.py first.
port = 8090                   # port the console POSTs to
path = "/data/report/"        # URL path the console POSTs to

# Each group has one master unit that dictates heating/cooling mode for the
# whole group. Mode commands are only ever sent to the master (without turning
# it on); member units are only powered on/off.

[groups.north]
master = "MPR"
members = ["MPR", "Bed 3", "Bed 4"]

[groups.south]
master = "Study"
members = ["Study", "Living", "Master", "Bed 2"]

# Per-room overrides of any [defaults] temperature value, or of `heating`
# (e.g. `heating = true` to keep one room heated while the rest is summer-only).

# Jeni prefers her room warmer. HRV will even it out eventually though.
[rooms."Bed 4"]
target_low = 23
target_high = 26

# Master & Bed 2 take a long time to warm and it's unnecessary
# I’ve chosen the target temperature based on where the heating curve begins to plateau
# HRV will even it out eventually
[rooms."Master"]
target_low = 22.2
target_high = 24.8

[rooms."Bed 2"]
target_low = 22.2
target_high = 24.8

# Living pumps hot air into north side, so want it slightly lower as well
[rooms."Living"]
target_low = 22.6
target_high = 24.8
